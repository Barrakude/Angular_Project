<div class="container mt-4">
    <div class="row">
        <div class="col-md-8 mx-auto">
            <div class="list-group">
                <div *ngFor="let contact of contacts" class="list-group-item list-group-item-action">
                    <div class="d-flex w-100 justify-content-between">
                        <h5 class="mb-1">{{ contact.nome }} {{ contact.cognome }}</h5>
                    </div>
                    <p class="mb-1">
                        <i class="bi bi-envelope me-2"></i>{{ contact.email }}
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>
