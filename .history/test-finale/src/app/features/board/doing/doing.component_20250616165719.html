<div class="container-fluid">
    <div class="row g-3">
        @for (task of tasks; track $index) {
            <div class="col-12 col-md-6">
                <tmg-task-card 
                    [task]="task" 
                    [showCompleteButton]="true"
                    [showBackButton]="true"
                    (actionClick)="onTaskAction($event)">
                </tmg-task-card>
            </div>
        }
    </div>
</div>
