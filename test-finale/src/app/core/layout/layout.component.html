<div class="d-flex flex-column vh-100">
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
        <div class="container-fluid">
            <button class="btn btn-outline-light me-3" type="button" (click)="toggleSidebar()">
                <i class="bi bi-list-task"></i>
            </button>
            <span class="navbar-brand mb-0 h1">Task Manager</span>
        </div>
    </nav>

    <!-- Sidebar -->
    <div class="offcanvas offcanvas-start" [class.show]="sidebarOpen" tabindex="-1" style="top: 56px; height: calc(100vh - 56px);">
        <div class="offcanvas-body p-0">
            <ul class="list-group list-group-flush">
                <li class="list-group-item border-0">
                    <a routerLink="/board" routerLinkActive="active" class="nav-link text-dark">
                        <i class="fas fa-columns me-2"></i>
                        Board
                    </a>
                </li>
                <li class="list-group-item border-0">
                    <a routerLink="/task-list" routerLinkActive="active" class="nav-link text-dark">
                        <i class="fas fa-list-ul me-2"></i>
                        Task List
                    </a>
                </li>
                <li class="list-group-item border-0">
                    <a routerLink="/create-task" routerLinkActive="active" class="nav-link text-dark">
                        <i class="fas fa-list-ul me-2"></i>
                        Crea Task
                    </a>
                </li>
            </ul>
        </div>
    </div>

    <!-- Main Content -->
    <main class="flex-grow-1" [style.margin-left.px]="sidebarOpen ? 250 : 0" style="margin-top: 56px; transition: margin-left 0.3s ease;">
        <div class="container-fluid p-4">
            <router-outlet></router-outlet>
        </div>
    </main>
</div>

<style>
.offcanvas {
    width: 250px !important;
    transition: transform 0.3s ease;
}

.nav-link.active {
    background-color: #0d6efd !important;
    color: white !important;
    border-radius: 0.375rem;
    margin: 0 10px;
}

@media (max-width: 768px) {
    main {
        margin-left: 0 !important;
    }
}
</style>
